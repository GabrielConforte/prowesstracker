<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Prowess Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prowess">
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2029;
    --panel-2: #262a36;
    --text: #eef0f5;
    --muted: #9aa1b2;
    --blue: #3b82f6;
    --red: #ef4444;
    --izzet: linear-gradient(135deg, #2563eb, #dc2626);
    --green: #22c55e;
    --amber: #f59e0b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: default; transform: none; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(20, 22, 28, 0.96);
    backdrop-filter: blur(6px);
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-2);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 1.15rem; margin: 0; }
  .stats-row { display: flex; gap: 14px; color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .stats-row b { color: var(--text); }
  .life { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .life-box { background: var(--panel); border-radius: 12px; padding: 6px 8px; box-shadow: inset 0 0 0 1px var(--life-c); }
  .life-box.me { --life-c: #166534; }
  .life-box.opp { --life-c: #7f1d1d; }
  .life-label { font-size: 0.75rem; color: var(--muted); text-align: center; }
  .life-row { display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; gap: 3px; align-items: center; }
  .life-row b { font-size: 1.6rem; font-variant-numeric: tabular-nums; text-align: center; min-width: 2.2ch; }
  .life-row b.low { color: var(--red); }
  .life-row button { background: var(--panel-2); padding: 7px 0; font-size: 0.8rem; font-weight: 700; }
  .btn-attack { width: 100%; background: #7f1d1d; padding: 12px; font-weight: 700; margin-bottom: 12px; }
  .btn-reset { width: 100%; background: var(--panel); color: var(--muted); padding: 12px; margin-top: 22px; }
  .btn-reset.armed { background: var(--red); color: #fff; }
  .actions { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-top: 10px; }
  .btn-spell { background: var(--izzet); padding: 12px; font-weight: 700; }
  .btn-undo { background: var(--panel-2); padding: 12px 14px; }
  .btn-eot { background: var(--amber); color: #1a1205; padding: 12px 14px; font-weight: 700; }

  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }

  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; margin-bottom: 22px; }
  .roster-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border-radius: var(--radius); padding: 10px 12px;
  }
  .avatar {
    width: 40px; height: 40px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.35rem;
    background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--accent);
  }
  .roster-item .name { flex: 1; min-width: 0; }
  .name-short { display: none; }
  .counter { display: flex; align-items: center; gap: 8px; }
  .roster-item .name small { display: block; color: var(--muted); font-size: 0.75rem; }
  .roster-item .count { min-width: 1.5em; text-align: center; font-weight: 700; }
  .round { width: 38px; height: 38px; border-radius: 50%; background: var(--panel-2); font-size: 1.3rem; line-height: 1; }
  .round.plus { background: var(--blue); }

  .field { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; background: var(--panel); border-radius: var(--radius); }

  .card {
    min-width: 0;
    background: var(--panel);
    border-radius: var(--radius);
    padding: 12px;
    border-top: 4px solid var(--accent, var(--blue));
    display: flex; flex-direction: column; gap: 8px;
  }
  .card-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
  .card .remove {
    width: 30px; height: 30px; background: var(--panel-2); color: var(--muted); align-self: start;
  }
  .art {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.6rem;
    background: radial-gradient(circle at 35% 30%, var(--panel-2), var(--bg));
    box-shadow: 0 0 0 2px var(--accent), 0 0 18px -4px var(--accent);
  }
  .pt { text-align: center; font-size: 2.4rem; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: 0.02em; line-height: 1; }
  .pt .boosted { color: var(--green); }
  .card-name { text-align: center; font-weight: 600; }
  .keywords { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; min-height: 22px; }
  .kw { font-size: 0.72rem; background: var(--panel-2); border-radius: 999px; padding: 3px 8px; color: var(--muted); }
  .kw.on { background: #1e3a2a; color: #86efac; }
  .breakdown { text-align: center; font-size: 0.75rem; color: var(--muted); min-height: 1em; }

  .btn-prowess { background: var(--izzet); padding: 12px; font-weight: 800; font-size: 1.05rem; }
  .prowess-count { font-weight: 400; opacity: 0.85; font-size: 0.85rem; }

  .pump { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 6px; align-items: center; }
  .pump span { font-size: 1.1rem; width: 32px; text-align: center; }
  .pump button { background: var(--panel-2); padding: 9px 0; font-weight: 700; }

  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .toggle { background: var(--panel-2); padding: 9px 6px; font-size: 0.8rem; color: var(--muted); }
  .toggle.on { background: #3b2a0a; color: #fcd34d; box-shadow: inset 0 0 0 1px #b45309; }
  .toggle.full { grid-column: 1 / -1; }
  .toggle.delirium.on { background: #2e1065; color: #d8b4fe; box-shadow: inset 0 0 0 1px #7c3aed; }

  /* Celular: todo más compacto, criaturas de a dos por fila */
  @media (max-width: 600px) {
    header { padding: 8px 12px; }
    h1 { font-size: 1rem; }
    .stats-row { gap: 10px; font-size: 0.78rem; margin-top: 2px; }
    .life { margin-top: 6px; gap: 6px; }
    .life-box { padding: 4px 6px; }
    .life-label { font-size: 0.7rem; }
    .life-row b { font-size: 1.35rem; }
    .life-row button { padding: 6px 0; font-size: 0.75rem; }
    .actions { margin-top: 6px; gap: 6px; }
    .btn-spell, .btn-undo, .btn-eot { padding: 10px; font-size: 0.9rem; }

    main { padding: 12px; }
    h2 { margin-bottom: 8px; }
    .name-full { display: none; }
    .name-short { display: inline; }

    .roster { grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
    .roster-item { flex-wrap: wrap; gap: 6px 8px; padding: 8px; }
    .avatar { width: 30px; height: 30px; font-size: 1rem; }
    .roster-item .name { font-size: 0.9rem; font-weight: 600; }
    .roster-item .name small { font-weight: 400; }
    .counter { width: 100%; justify-content: space-between; }
    .round { width: 34px; height: 34px; font-size: 1.15rem; }

    .btn-attack { padding: 10px; font-size: 0.9rem; margin-bottom: 8px; }
    .field { grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { padding: 8px; gap: 6px; border-top-width: 3px; }
    .card-top { gap: 4px; }
    .art { width: 32px; height: 32px; font-size: 1.05rem; }
    .pt { font-size: 1.75rem; }
    .card .remove { width: 24px; height: 24px; font-size: 0.85rem; border-radius: 8px; }
    .card-name { font-size: 0.85rem; }
    .keywords { min-height: 0; gap: 3px; }
    .kw { font-size: 0.65rem; padding: 2px 6px; }
    .breakdown { font-size: 0.65rem; min-height: 0; }
    .breakdown:empty { display: none; }
    .btn-prowess { padding: 9px 4px; font-size: 0.95rem; }
    .pump { gap: 4px; grid-template-columns: 20px 1fr 1fr 1fr; }
    .pump span { width: 20px; font-size: 0.85rem; }
    .pump button { padding: 7px 0; font-size: 0.85rem; }
    .toggles { gap: 4px; }
    .toggle { padding: 7px 2px; font-size: 0.72rem; }
    .btn-reset { margin-top: 16px; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #000c; padding: 10px 16px; border-radius: 999px; font-size: 0.9rem;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>⚡🔥 Prowess Tracker</h1>
  </div>
  <div class="stats-row">
    <span>⏳ Turno <b id="turnCount">1</b></span>
    <span>📜 Hechizos: <b id="spellCount">0</b></span>
    <span>💥 Daño total: <b id="totalPower">0</b></span>
  </div>
  <div class="life">
    <div class="life-box me">
      <div class="life-label">❤️ Yo</div>
      <div class="life-row">
        <button data-life="me" data-d="-5">−5</button>
        <button data-life="me" data-d="-1">−1</button>
        <b id="lifeMe">20</b>
        <button data-life="me" data-d="1">+1</button>
        <button data-life="me" data-d="5">+5</button>
      </div>
    </div>
    <div class="life-box opp">
      <div class="life-label">💀 Rival</div>
      <div class="life-row">
        <button data-life="opp" data-d="-5">−5</button>
        <button data-life="opp" data-d="-1">−1</button>
        <b id="lifeOpp">20</b>
        <button data-life="opp" data-d="1">+1</button>
        <button data-life="opp" data-d="5">+5</button>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="btn-spell" id="castSpell" title="Dispara el prowess de todas las criaturas">⚡ Hechizo no-criatura</button>
    <button class="btn-undo" id="undo" title="Deshacer">↶</button>
    <button class="btn-eot" id="endTurn">🌙 Fin de turno</button>
  </div>
</header>

<main>
  <h2>Criaturas</h2>
  <div class="roster" id="roster"></div>

  <h2>Campo</h2>
  <button class="btn-attack" id="attack">💥 Pegar con todo</button>
  <div class="field" id="field"></div>

  <button class="btn-reset" id="newGame">🔄 Nueva partida</button>
</main>

<div class="toast" id="toast"></div>

<script>
// Datos de las criaturas del mazo.
// trigger: lo que suma cada vez que se lanza un hechizo no-criatura (null = no tiene).
const CREATURES = {
  swiftspear: {
    name: "Monastery Swiftspear",
    short: "Swiftspear",
    power: 1, toughness: 2,
    keywords: ["Prisa"],
    trigger: { power: 1, toughness: 1 },
    accent: "#ef4444",
    icon: "🔱",
  },
  slickshot: {
    name: "Slickshot Show-Off",
    short: "Slickshot",
    power: 1, toughness: 2,
    keywords: ["Vuela", "Prisa"],
    trigger: { power: 2, toughness: 0 },
    accent: "#f97316",
    icon: "🦅",
  },
  drc: {
    name: "Dragon's Rage Channeler",
    short: "DRC",
    power: 1, toughness: 1,
    keywords: [],
    trigger: null,
    accent: "#a855f7",
    icon: "🐉",
  },
  monk: {
    name: "Monk token",
    short: "Monk",
    subtitle: "Ficha 1/1",
    power: 1, toughness: 1,
    keywords: [],
    trigger: { power: 1, toughness: 1 },
    accent: "#e5e7eb",
    icon: "🥋",
  },
};

// Monster role (Monstrous Rage): +1/+1 y arrolla. Permanente.
const ROLE = { power: 1, toughness: 1 };
// Cori-Steel Cutter: +1/+1, arrolla y prisa. Permanente.
const CUTTER = { power: 1, toughness: 1 };
// Delirium: DRC pasa a ser 3/3 con vuelo.
const DELIRIUM = { power: 2, toughness: 2 };

const KW_ICONS = { "Vuela": "🪽", "Prisa": "💨", "Arrolla": "🦏" };

const STORAGE_KEY = "prowess-tracker-state-v1";
const MAX_UNDO = 50;
const STARTING_LIFE = 20;

let state = loadState();
let history = [];
let nextId = state.nextId || 1;

function freshState() {
  return { creatures: [], spells: 0, turn: 1, delirium: false, life: { me: STARTING_LIFE, opp: STARTING_LIFE }, nextId: 1 };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.creatures)) {
        if (!parsed.life) parsed.life = { me: STARTING_LIFE, opp: STARTING_LIFE };
        if (!parsed.turn) parsed.turn = 1;
        return parsed;
      }
    }
  } catch (e) { /* sin storage: arrancamos de cero */ }
  return freshState();
}

function saveState() {
  state.nextId = nextId;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignorar */ }
}

// Todas las modificaciones pasan por acá para poder deshacer.
function act(mutator) {
  history.push(JSON.stringify(state));
  if (history.length > MAX_UNDO) history.shift();
  mutator();
  saveState();
  render();
}

function undo() {
  if (!history.length) return;
  state = JSON.parse(history.pop());
  nextId = Math.max(nextId, state.nextId || 1);
  saveState();
  render();
  toast("↶ Deshecho");
}

function newCreature(type) {
  return {
    id: nextId++,
    type,
    prowessP: 0, prowessT: 0, // bonus de prowess hasta fin de turno
    triggers: 0,
    pumpP: 0, pumpT: 0,       // bonus manuales (+1/+2/+3) hasta fin de turno
    role: false,              // Monster role (permanente)
    cutter: false,            // Cori-Steel Cutter equipada (permanente)
  };
}

function stats(c) {
  const def = CREATURES[c.type];
  let p = def.power, t = def.toughness;
  const kw = [...def.keywords];
  if (c.type === "drc" && state.delirium) {
    p += DELIRIUM.power; t += DELIRIUM.toughness;
    if (!kw.includes("Vuela")) kw.push("Vuela");
  }
  p += c.prowessP + c.pumpP;
  t += c.prowessT + c.pumpT;
  if (c.role) { p += ROLE.power; t += ROLE.toughness; }
  if (c.cutter) { p += CUTTER.power; t += CUTTER.toughness; }
  if (c.role || c.cutter) kw.push("Arrolla");
  if (c.cutter && !kw.includes("Prisa")) kw.push("Prisa");
  return { p, t, kw: [...new Set(kw)] };
}

// --- Acciones ---

function addCreature(type) {
  act(() => state.creatures.push(newCreature(type)));
}

function removeOne(type) {
  const idx = state.creatures.map(c => c.type).lastIndexOf(type);
  if (idx === -1) return;
  act(() => state.creatures.splice(idx, 1));
}

function removeById(id) {
  act(() => { state.creatures = state.creatures.filter(c => c.id !== id); });
}

function applyTrigger(c) {
  const trig = CREATURES[c.type].trigger;
  if (!trig) return;
  c.prowessP += trig.power;
  c.prowessT += trig.toughness;
  c.triggers += 1;
}

function castSpell() {
  act(() => {
    state.spells += 1;
    state.creatures.forEach(applyTrigger);
  });
  toast(`⚡ Hechizo #${state.spells}: prowess a todas`);
}

function prowessOne(id) {
  act(() => {
    const c = state.creatures.find(x => x.id === id);
    if (c) applyTrigger(c);
  });
}

function pump(id, stat, amount) {
  act(() => {
    const c = state.creatures.find(x => x.id === id);
    if (!c) return;
    if (stat === "p") c.pumpP += amount; else c.pumpT += amount;
  });
}

function toggle(id, key) {
  act(() => {
    const c = state.creatures.find(x => x.id === id);
    if (c) c[key] = !c[key];
  });
}

function toggleDelirium() {
  act(() => { state.delirium = !state.delirium; });
}

function changeLife(who, delta) {
  act(() => { state.life[who] += delta; });
}

function totalPower() {
  return state.creatures.reduce((sum, c) => sum + Math.max(0, stats(c).p), 0);
}

function attack() {
  const dmg = totalPower();
  if (!dmg) return;
  act(() => { state.life.opp -= dmg; });
  toast(`💥 ${dmg} de daño al rival`);
}

let resetTimer;
function newGame() {
  const btn = document.getElementById("newGame");
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed");
    btn.textContent = "¿Seguro? Tocá de nuevo para reiniciar";
    resetTimer = setTimeout(disarmReset, 3000);
    return;
  }
  disarmReset();
  act(() => {
    const fresh = freshState();
    fresh.nextId = nextId;
    state = fresh;
  });
  toast("🔄 Nueva partida");
}

function disarmReset() {
  clearTimeout(resetTimer);
  const btn = document.getElementById("newGame");
  btn.classList.remove("armed");
  btn.textContent = "🔄 Nueva partida";
}

function endTurn() {
  act(() => {
    state.turn += 1;
    state.spells = 0;
    state.creatures.forEach(c => {
      c.prowessP = c.prowessT = 0;
      c.pumpP = c.pumpT = 0;
      c.triggers = 0;
    });
  });
  toast(`🌙 Turno ${state.turn}: bonus temporales limpiados`);
}

// --- Render ---

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "onclick") node.addEventListener("click", v);
    else if (k === "html") node.innerHTML = v;
    else if (k === "style") node.style.cssText = v;
    else if (v === true) node.setAttribute(k, "");
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const ch of [].concat(children)) {
    if (ch == null) continue;
    node.append(ch.nodeType ? ch : document.createTextNode(ch));
  }
  return node;
}

function signed(n) { return (n >= 0 ? "+" : "") + n; }

function renderRoster() {
  const roster = document.getElementById("roster");
  roster.replaceChildren(...Object.entries(CREATURES).map(([type, def]) => {
    const count = state.creatures.filter(c => c.type === type).length;
    const sub = def.subtitle || `${def.power}/${def.toughness}`;
    return el("div", { class: "roster-item" }, [
      el("div", { class: "avatar", style: `--accent:${def.accent}` }, def.icon),
      el("div", { class: "name" }, [
        el("span", { class: "name-full" }, def.name),
        el("span", { class: "name-short" }, def.short),
        el("small", {}, sub),
      ]),
      el("div", { class: "counter" }, [
        el("button", { class: "round", onclick: () => removeOne(type), disabled: count === 0, "aria-label": "Quitar" }, "−"),
        el("span", { class: "count" }, String(count)),
        el("button", { class: "round plus", onclick: () => addCreature(type), "aria-label": "Agregar" }, "+"),
      ]),
    ]);
  }));
}

function renderCard(c) {
  const def = CREATURES[c.type];
  const s = stats(c);
  const boostedP = s.p > def.power;
  const boostedT = s.t > def.toughness;

  const parts = [];
  if (c.type === "drc" && state.delirium) parts.push("delirium +2/+2");
  if (c.prowessP || c.prowessT) parts.push(`prowess ${signed(c.prowessP)}/${signed(c.prowessT)}`);
  if (c.pumpP || c.pumpT) parts.push(`pump ${signed(c.pumpP)}/${signed(c.pumpT)}`);
  if (c.role) parts.push("role +1/+1");
  if (c.cutter) parts.push("cutter +1/+1");

  const middle = def.trigger
    ? el("button", { class: "btn-prowess", onclick: () => prowessOne(c.id) }, [
        `🔥 ${signed(def.trigger.power)}/${signed(def.trigger.toughness)} `,
        c.triggers ? el("span", { class: "prowess-count" }, `(×${c.triggers})`) : null,
      ])
    : el("button", { class: "toggle full delirium" + (state.delirium ? " on" : ""), onclick: toggleDelirium },
        state.delirium ? "🌀 Delirium ✓" : "🌀 Delirium");

  const pumpRow = (label, stat) => el("div", { class: "pump" }, [
    el("span", {}, label),
    ...[3, 2, 1].map(n => el("button", { onclick: () => pump(c.id, stat, n) }, `+${n}`)),
  ]);

  return el("div", { class: "card", style: `--accent:${def.accent}` }, [
    el("div", { class: "card-top" }, [
      el("div", { class: "art" }, def.icon),
      el("div", { class: "pt" }, [
        el("span", { class: boostedP ? "boosted" : "" }, String(s.p)),
        "/",
        el("span", { class: boostedT ? "boosted" : "" }, String(s.t)),
      ]),
      el("button", { class: "remove", onclick: () => removeById(c.id), "aria-label": "Sacar del campo" }, "×"),
    ]),
    el("div", { class: "card-name" }, [
      el("span", { class: "name-full" }, def.name),
      el("span", { class: "name-short" }, def.short),
    ]),
    el("div", { class: "keywords" }, s.kw.map(k => el("span", { class: "kw" + ((k === "Arrolla" || (k === "Prisa" && c.cutter) || (k === "Vuela" && c.type === "drc")) ? " on" : "") }, `${KW_ICONS[k] || ""} ${k}`))),
    el("div", { class: "breakdown" }, parts.join(" · ")),
    middle,
    pumpRow("⚔️", "p"),
    pumpRow("🛡️", "t"),
    el("div", { class: "toggles" }, [
      el("button", { class: "toggle" + (c.role ? " on" : ""), onclick: () => toggle(c.id, "role") },
        c.role ? "👹 Role ✓" : "👹 Role"),
      el("button", { class: "toggle" + (c.cutter ? " on" : ""), onclick: () => toggle(c.id, "cutter") },
        c.cutter ? "🗡️ Cori ✓" : "🗡️ Cori"),
    ]),
  ]);
}

function render() {
  renderRoster();
  const field = document.getElementById("field");
  if (!state.creatures.length) {
    field.replaceChildren(el("div", { class: "empty" }, "🃏 No hay criaturas en el campo. Agregalas con el +."));
  } else {
    field.replaceChildren(...state.creatures.map(renderCard));
  }
  document.getElementById("turnCount").textContent = state.turn;
  document.getElementById("spellCount").textContent = state.spells;
  const power = totalPower();
  document.getElementById("totalPower").textContent = power;
  const attackBtn = document.getElementById("attack");
  attackBtn.textContent = `💥 Pegar con todo: −${power} al rival`;
  attackBtn.disabled = power === 0;
  for (const [who, id] of [["me", "lifeMe"], ["opp", "lifeOpp"]]) {
    const node = document.getElementById(id);
    node.textContent = state.life[who];
    node.classList.toggle("low", state.life[who] <= 5);
  }
  document.getElementById("undo").disabled = history.length === 0;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

document.getElementById("castSpell").addEventListener("click", castSpell);
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("endTurn").addEventListener("click", endTurn);
document.getElementById("attack").addEventListener("click", attack);
document.getElementById("newGame").addEventListener("click", newGame);
document.querySelectorAll("[data-life]").forEach(btn =>
  btn.addEventListener("click", () => changeLife(btn.dataset.life, Number(btn.dataset.d))));

render();
</script>
</body>
</html>
