name: Descargar cartas de Scryfall

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_scryfall.py
      - .github/workflows/scryfall.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_scryfall.py
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizar cartas de Scryfall"
          git push
